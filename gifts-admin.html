<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gift Registry Admin</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/resources/css/gifts.css">
</head>
<body>
  <div class="container">
    <h1>Gift Registry — Admin</h1>

    <section id="auth">
  <label for="admin-secret">Admin secret</label>
  <input id="admin-secret" type="password" autocomplete="new-password" />
  <button id="auth-save" class="btn btn-primary">Save secret (in-memory)</button>
      <div id="auth-status"></div>
    </section>

    <section id="create">
      <h2>Create Gift</h2>
      <label>Title<input id="create-title" /></label>
      <label>Description<textarea id="create-desc"></textarea></label>
      <label>Price<input id="create-price" type="number" step="0.01" /></label>
      <label>Quantity<input id="create-qty" type="number" value="1" /></label>
      <label>Purchase URL<input id="create-purchase" /></label>
  <button id="create-btn" class="btn btn-primary">Create</button>
      <div id="create-feedback" role="status"></div>
    </section>

    <section id="registry-toggle" style="margin-top:1.5rem;">
      <h2>Registry Settings</h2>
      <div style="display:flex;align-items:center;gap:0.5rem;">
        <label for="registry-enabled">Registry live listings</label>
        <button id="toggle-registry" class="btn btn-primary">Loading...</button>
        <div id="toggle-status" style="margin-left:0.5rem;color:var(--muted)"></div>
      </div>
      <div style="margin-top:.5rem;color:var(--muted);font-size:.95rem;">Note: If a Netlify environment variable <code>REGISTRY_ENABLED</code> is set on the site, it will take precedence over this toggle.</div>
    </section>

    <section id="manage">
      <h2>Manage Gifts</h2>
      <div id="admin-gifts-list"></div>
    </section>
  </div>

  <div id="edit-modal" class="modal" hidden>
    <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="edit-title-label">
      <h2 id="edit-title-label">Edit Gift</h2>
      <input id="edit-id" type="hidden" />
      <label for="edit-title">Title</label>
      <input id="edit-title" type="text" />
      <label for="edit-desc">Description</label>
      <textarea id="edit-desc"></textarea>
      <label for="edit-image">Image URL</label>
      <input id="edit-image" type="text" />
      <label for="edit-price">Price</label>
      <input id="edit-price" type="number" step="0.01" />
      <label for="edit-qty">Quantity</label>
      <input id="edit-qty" type="number" min="0" />
      <label for="edit-purchase">Purchase URL</label>
      <input id="edit-purchase" type="text" />
      <div style="display:flex;gap:.75rem;justify-content:flex-end;margin-top:1rem;">
        <button id="edit-cancel" class="btn btn-secondary" type="button">Cancel</button>
        <button id="edit-save" class="btn btn-primary" type="button">Save</button>
      </div>
      <div id="edit-feedback" role="status" style="margin-top:.5rem"></div>
    </div>
  </div>

  <script src="/resources/js/gifts-admin.js" defer></script>
</body>
</html>
