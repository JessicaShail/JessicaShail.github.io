<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gift Registry</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/resources/css/gifts.css">
</head>
<body>
  <div class="container">
    <h1>Gift Registry</h1>
    <div id="gifts-list" class="gifts-grid" aria-live="polite"></div>
  </div>

  <!-- Detail modal -->
  <div id="gift-modal" class="modal" hidden>
    <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="gift-title">
      <button id="modal-close" class="modal-close" aria-label="Close">×</button>
      <h2 id="gift-title"></h2>
      <img id="gift-image" src="" alt="" />
      <p id="gift-desc"></p>
      <p id="gift-price"></p>
      <p id="gift-qty"></p>
      <div class="modal-actions">
        <a id="gift-purchase" class="btn btn-secondary" href="#" target="_blank" rel="noopener" style="display:none;">Buy / Purchase</a>
        <label for="reserve-qty">Quantity</label>
        <input id="reserve-qty" type="number" min="1" value="1" />
      </div>
      <label for="reserver-name">Your name</label>
      <div class="autocomplete-container">
        <input id="reserver-name" type="text" autocomplete="off" />
        <div id="reserverSuggestions" class="autocomplete-suggestions" aria-label="Suggestions"></div>
      </div>
  <!-- Email removed from standalone gifts page - we use RSVP email in DB -->
      <!-- Note removed - not required -->
      <div style="display:flex;gap:.5rem;align-items:center;margin-top:.75rem;">
        <button id="reserve-btn" class="btn btn-primary">Reserve</button>
        <div id="reserve-feedback" role="status" style="margin-left:.5rem"></div>
      </div>
    </div>
  </div>

  <script src="/resources/js/gifts.js" defer></script>
</body>
</html>
